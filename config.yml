server_configurations:
  config_path: ~/dev/LowLevelMonitoring/config.yml
  prometheus:
    target_server:
      controller: "130.149.248.100"
      workers: ["130.149.248.100"]
      address: "http://130.149.248.100:9090"
      timeout: 10s
      interval: 1
monitoring_targets:
  task_metadata:
    enabled: true
    data_sources:
      - source: slurm-job-exporter
        labels: [instance,job_name,job_state,node,run_time,work_dir]
        identifier: work_dir
        metrics:
          - name: slurm_job_id
            query: slurm_job_id
            unit: ""
  cpu:
    enabled: true
    data_sources:
      - source: cAdvisor
        labels: [id, image, job,name]
        identifier: name
        metrics:
          - name: container_cpu_user_seconds_total
            query: container_cpu_user_seconds_total
            unit: seconds
      - source: ebpf-mon
        labels: [container_id, name]
        identifier: name
        metrics:
          - name: container_weighted_cycles
            query: container_weighted_cycles
            unit: counter
      - source: docker-activity
        labels: [container_id, container_name,instance]
        identifier: container_name
        metrics:
          - name: cpuPercent
            query: cpuPercent
            unit: percentage (%)
  memory:
    enabled: true
    data_sources:
      - source: cAdvisor
        labels: [id, image, job,name]
        identifier: name
        metrics:
          - name: container_memory_usage_bytes
            query: container_memory_usage_bytes
            unit: bytes
      - source: docker-activity
        labels: [container_id, container_name,instance]
        identifier: container_name
        metrics:
          - name: memoryUsage
            query: memoryUsage
            unit: bytes
  disk:
    enabled: true
    data_sources:
      - source: cAdvisor
        labels: [id, image, job,name]
        identifier: name
        metrics:
          - name: container_blkio_device_usage_total
            query: container_blkio_device_usage_total
            unit: bytes
          - name: container_fs_io_current
            query: container_fs_io_current
            unit: bytes
          - name: container_fs_reads_bytes_total
            query: container_fs_reads_bytes_total
            unit: bytes
          - name: container_fs_writes_bytes_total
            query: container_fs_writes_bytes_total
            unit: bytes
  network:
    enabled: false
    data_sources:
      - source: cAdvisor
        labels: [id, image, job,name]
        identifier: name
        metrics:
          - name: container_network_transmit_bytes_total
            query: container_network_transmit_bytes_total
            unit: bytes
  energy:
    enabled: true
    data_sources:
      - source: docker-activity
        labels: [container_id, container_name,instance]
        identifier: container_name
        metrics:
          - name: energyUsage
            query: cpuEnergy
            unit: microjoules
      - source: ebpf-mon
        labels: [container_id, name]
        identifier: name
        metrics:
          - name: container_power 
            query: container_power
            unit: microjoules
      - source: ipmi-exporter
        labels: [name]
        identifier: job
        metrics:
          - name: ipmi_voltage_volts
            query: ipmi_voltage_volts
            unit: volts
          - name: ipmi_temperature_celsius
            query: ipmi_temperature_celsius
            unit: celsius
      - source: snmp-exporter
        labels: [name]
        identifier: instance
        metrics:
          - name: gude_power_watts
            query: gude_power_watts
            unit: watts
          - name: gude_energy_wh_total
            query: gude_energy_wh_total
            unit: watts
          - name: gude_voltage_v
            query: gude_voltage_v
            unit: volts
          - name: gude_current_ma
            query: gude_current_ma
            unit: ma
